[project]
name = "agentforge"
version = "0.1.0"
description = "Clinical Co-Pilot agent sidecar for OpenEMR (FastAPI + LangGraph)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Cameron Candelori", email = "cameron.candelori@challenger.gauntletai.com" },
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "langgraph>=0.2",
    "httpx>=0.27",
    "redis[hiredis]>=5.0",
    "langfuse>=2.40",
    "pyjwt[crypto]>=2.8",
    "python-dotenv>=1.0",
    "anthropic>=0.30",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["langgraph.*", "langfuse.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `slow` marks tests that hit the real Anthropic API end-to-end
# (~10-25s each). The integration suite's auth/error/patient-context
# tests are fast (<1s/test, no LLM); only the UC-flow tests in
# tests/integration/test_use_cases.py spend tokens. Run them
# explicitly with: uv run pytest -m slow
addopts = [
    "--strict-markers",
    "--strict-config",
    "-m",
    "not slow and not latency and not eval",
]
markers = [
    "slow: integration tests that call the real LLM (deselected by default)",
    "latency: latency-budget tests that fire many requests (deselected by default)",
    "eval: baseline eval suite — invokes the real orchestrator end-to-end against the running stack and spends Anthropic tokens (deselected by default)",
]
