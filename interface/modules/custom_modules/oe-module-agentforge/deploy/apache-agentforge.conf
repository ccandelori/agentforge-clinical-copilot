# AgentForge — Apache reverse-proxy + access-control include.
#
# Drop into the host's Apache conf.d (Alpine/dev-easy:
# /etc/apache2/conf.d/agentforge.conf) or conf-available + a2enconf
# (Debian/Ubuntu prod images). Include order doesn't matter; the
# directives apply globally to the server config.
#
# This file does TWO things:
#
#   1. Adds a clean URL `/agentforge/turn` that rewrites to the PHP
#      module's turn entry point. Lets the chat-panel (or any client)
#      post to a stable, short URL without exposing the internal
#      module path.
#
#   2. Restricts `/interface/modules/custom_modules/oe-module-agentforge/
#      public/internal/*` to private network ranges only. The sidecar's
#      JWT validation is the primary auth gate; this is defense in
#      depth that returns 403 at the network edge before PHP even runs.
#
# Note: the PHP module's AgentProxyController already does session
# bridging + JWT minting in turn.php. We deliberately do NOT
# reverse-proxy /agentforge/turn directly to the sidecar — Apache
# routes it to PHP, PHP mints the JWT, then PHP forwards to the
# sidecar. The clean-URL rewrite is purely a convenience layer.

# ----------------------------------------------------------------------
# 1. Clean URL for the agent's user-facing turn endpoint.
#
# We use Alias rather than RewriteRule because Alias runs during
# Apache's URL-to-filename phase (before the FilesMatch \.php$
# FastCGI handler matches), so the .php SetHandler picks the
# aliased file up correctly. The same trick can extend to other
# clean-URL endpoints by adding more Alias lines.
# ----------------------------------------------------------------------
Alias /agentforge/turn /var/www/localhost/htdocs/openemr/interface/modules/custom_modules/oe-module-agentforge/public/turn.php

# ----------------------------------------------------------------------
# 2. Localhost / private-network-only access on the internal endpoints.
#
# The sidecar reaches these via the docker bridge (typically
# 172.16.0.0/12) or a kubernetes pod network (10.0.0.0/8). Public
# internet traffic is denied at the network edge as defense in depth
# on top of the JWT validation inside each PHP entry point.
# ----------------------------------------------------------------------
<LocationMatch "^/interface/modules/custom_modules/oe-module-agentforge/public/internal/">
    Require ip 127.0.0.1
    Require ip ::1
    Require ip 10.0.0.0/8
    Require ip 172.16.0.0/12
    Require ip 192.168.0.0/16
</LocationMatch>
