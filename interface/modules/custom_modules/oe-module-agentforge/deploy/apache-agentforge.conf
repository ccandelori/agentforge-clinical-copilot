# AgentForge — Apache access-control include.
#
# Drop into the host's Apache conf.d (Alpine/dev-easy:
# /etc/apache2/conf.d/agentforge.conf) or conf-available + a2enconf
# (Debian/Ubuntu prod images). Include order doesn't matter; the
# directives apply globally to the server config.
#
# Restricts `/interface/modules/custom_modules/oe-module-agentforge/
# public/internal/*` to private network ranges only. The sidecar's
# JWT validation is the primary auth gate; this is defense in depth
# that returns 403 at the network edge before PHP even runs.

# ----------------------------------------------------------------------
# Localhost / private-network-only access on the internal endpoints.
#
# The sidecar reaches these via the docker bridge (typically
# 172.16.0.0/12) or a kubernetes pod network (10.0.0.0/8). Public
# internet traffic is denied at the network edge as defense in depth
# on top of the JWT validation inside each PHP entry point.
# ----------------------------------------------------------------------
<LocationMatch "^/interface/modules/custom_modules/oe-module-agentforge/public/internal/">
    Require ip 127.0.0.1
    Require ip ::1
    Require ip 10.0.0.0/8
    Require ip 172.16.0.0/12
    Require ip 192.168.0.0/16
</LocationMatch>
