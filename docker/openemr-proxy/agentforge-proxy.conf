# AgentForge sidecar reverse proxy.
#
# Purpose: expose the agentforge-sidecar container's surface (the Vue
# dashboard SPA + the BFF auth and FHIR/agent routes) at the same
# origin as OpenEMR (https://<droplet>:9300/) so the dashboard's
# HttpOnly session cookie rides same-origin and the browser never
# sees a separate sidecar host. Without this, the sidecar is
# reachable only on the docker network — fine for openemr-internal
# calls but not for the user's browser.
#
# Path layout:
#   /dashboard/*  → sidecar /*  (Vue SPA, prefix-stripped at the proxy)
#   /auth/*       → sidecar /auth/*
#   /api/*        → sidecar /api/*
#
# Everything else (/interface/, /apis/, /portal/, etc.) keeps falling
# through to OpenEMR's PHP — the proxy paths above are scoped to the
# three prefixes the dashboard owns, so OpenEMR's existing surface is
# untouched. (OpenEMR's own API lives at /apis/, plural — no collision.)
#
# Loaded after openemr.conf via the alphabetically-late filename so
# proxy directives apply globally to both the :80 and :443 vhosts.

# Don't act as a forward proxy.
ProxyRequests Off

# Preserve the Host header sent by the client. The sidecar uses the
# Host to build absolute URLs (e.g. the OAuth redirect_uri sent into
# the authorize request); without preserving it, those would be
# minted against the docker-internal hostname.
ProxyPreserveHost On

# Forward client's protocol so the sidecar can issue Secure cookies
# on the HTTPS edge.
RequestHeader set X-Forwarded-Proto "https" env=HTTPS
RequestHeader set X-Forwarded-Proto "http"  env=!HTTPS

# (mod_remoteip is not loaded in this Apache build, so we don't try
# to surface the real client IP into request_addr. Sidecar logs see
# the docker bridge IP for proxied requests; OpenEMR's own access log
# still captures the real client.)

# --- /dashboard/  →  Vue SPA (StaticFiles in sidecar) -----------------
# Trailing slash on both sides is intentional: it strips the /dashboard
# prefix so the sidecar receives requests at its own root paths
# (/index.html, /assets/*, etc).
ProxyPass        /dashboard/ http://agentforge-sidecar:8000/
ProxyPassReverse /dashboard/ http://agentforge-sidecar:8000/

# Bare /dashboard (no trailing slash) → 301 to /dashboard/ so the SPA's
# relative asset URLs resolve correctly.
RedirectMatch 301 ^/dashboard$ /dashboard/

# --- /auth/  →  BFF auth routes ---------------------------------------
ProxyPass        /auth/ http://agentforge-sidecar:8000/auth/
ProxyPassReverse /auth/ http://agentforge-sidecar:8000/auth/

# --- /api/  →  BFF api routes (FHIR proxy + /api/agent/turn) ----------
ProxyPass        /api/ http://agentforge-sidecar:8000/api/
ProxyPassReverse /api/ http://agentforge-sidecar:8000/api/

# Don't double-handle the proxy paths via DocumentRoot — Apache will
# try to mod_dir / index files otherwise and 403 the SPA's directory
# request. ProxyPass at the top level already short-circuits the
# default file resolution, but explicit blocks make this robust if a
# future vhost adds a Directory rule.
<Location "/dashboard/">
    Require all granted
</Location>
<Location "/auth/">
    Require all granted
</Location>
<Location "/api/">
    Require all granted
</Location>
