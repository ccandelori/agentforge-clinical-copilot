# ============================================================================
# .gitlab-ci.yml — AgentForge Week 2 CI bootstrap
# ============================================================================
#
# Scope (PRD Phase 0): catch regressions from MR #1 forward, before the
# 50-case agent-eval gate (Task 20) lands.
#
# Runs on every MR:
#   - PHP: phpstan (level 10), phpunit-isolated  (mirrors GitHub workflows)
#   - Sidecar: full pytest suite (markers exclude slow/latency/eval),
#              dedicated job for the 9 W1 regression locks for visibility.
#
# Verified locally before commit:
#   - sidecar `uv run pytest`              -> 774 passed, 13 deselected
#   - sidecar `uv run pytest tests/eval/regression_locks.py` -> 10 passed (~0.02s)
#
# No secrets needed at this stage. The eval marker tests (which call
# Anthropic) are deselected by default in sidecar/pyproject.toml.
# ============================================================================

default:
  interruptible: true

variables:
  COMPOSER_ALLOW_SUPERUSER: "1"
  COMPOSER_NO_INTERACTION: "1"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

stages:
  - test

# ============================================================================
# PHP — mirrors existing GitHub Actions surface (composer.yml, phpstan.yml,
# isolated-tests.yml). Extensions installed via mlocati/docker-php-extension-
# installer to match composer.json's ext-* requirements.
# ============================================================================

.php_base:
  image: php:8.2-cli
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git unzip ca-certificates curl
    - curl -sSL https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions -o /usr/local/bin/install-php-extensions
    - chmod +x /usr/local/bin/install-php-extensions
    - install-php-extensions bcmath calendar ctype curl dom fileinfo filter gd iconv imagick intl ldap mbstring mysqli openssl pdo pdo_mysql redis session soap sockets sodium xsl zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --prefer-dist --no-progress
  cache:
    key:
      files:
        - composer.lock
    paths:
      - vendor/

phpstan:
  extends: .php_base
  stage: test
  script:
    - composer phpstan

phpunit-isolated:
  extends: .php_base
  stage: test
  script:
    - composer phpunit-isolated

# ============================================================================
# Sidecar (Python 3.12 + uv).
# ============================================================================

.python_base:
  image: python:3.12-slim
  before_script:
    # uv ships as a PyPI wheel — no curl/apt-get bootstrap needed.
    # Avoids the recurring "no free space in /var/cache/apt/archives"
    # failure on shared GitLab runners with full disks.
    - pip install --quiet --root-user-action=ignore uv
    - cd sidecar
    - uv sync --frozen
  cache:
    key:
      files:
        - sidecar/uv.lock
    paths:
      - .uv-cache/

sidecar-pytest:
  extends: .python_base
  stage: test
  script:
    # Default markers in sidecar/pyproject.toml deselect slow/latency/eval.
    - uv run pytest

sidecar-regression-locks:
  extends: .python_base
  stage: test
  script:
    # Dedicated job: surfaces W1 lock regressions prominently in the CI summary
    # rather than buried in the 774-test sweep above.
    - uv run pytest tests/eval/regression_locks.py -v

# ============================================================================
# Agent eval gate (Task 20).
#
# Runs the W2 eval gate's CI entry point on every MR. Defaults are
# fully mocked — no Anthropic / judge spend per MR. The supervisor +
# judge are AsyncMocks inside scripts/run_eval_gate.sh; real-LLM mode
# is reserved for the manual baseline-regen path (a follow-up that
# needs the production Supervisor adapter, out of scope for Task 20).
#
# Image rationale: the mock path never loads the HF model weights, so
# the pre-baked sidecar image (Task 21) buys nothing here — we reuse
# the same python:3.12-slim base as sidecar-pytest. When the real-LLM
# manual job lands, it will swap in the pre-baked image (TBD registry
# path; see docs/DEVIATIONS.md 2026-05-08 entry).
#
# Artifacts: var/eval_gate_results.json + var/eval_gate_report.md.
# The markdown report is paste-ready for an MR comment; Task 20.3
# wires the actual posting via `glab mr note`.
#
# allow_failure is intentionally absent — the gate blocks merge on
# any violation. Override with a manual job click if the verdict
# warrants override (rare; a real regression should be fixed, not
# dismissed).
# ============================================================================
agent-eval:
  extends: .python_base
  stage: test
  rules:
    # Trigger on merge requests + on pushes to the main branch (so
    # protected-branch state stays green). Other branches don't run
    # the gate to keep CI bills bounded.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    # `.python_base` already cd's into sidecar/ in before_script and
    # ran `uv sync --frozen`. The wrapper itself cd's to its own
    # SIDECAR_DIR so it works whether invoked from sidecar/ or the
    # repo root — keeping this command flat means Task 22's GitHub
    # Actions mirror is a near-identical one-line copy.
    - ./scripts/run_eval_gate.sh
  after_script:
    # Post the markdown diff report as an MR comment whether the
    # gate passed or failed (after_script runs on both paths).
    #
    # Uses the GitLab API via curl directly — avoids installing glab
    # into the python:3.12-slim image, and the curl + jq baseline is
    # already present (apt-installed by .python_base's siblings or
    # via pip's bundled wheel deps). The Python `python -c` JSON
    # encode below means we don't have to worry about jq specifically.
    #
    # Auth precedence:
    #   1. GLAB_TOKEN — preferred; a masked project / group access
    #      token with `api` scope. Set this if you want CI comments.
    #   2. CI_JOB_TOKEN — works if the project's CI/CD settings
    #      allow job-token MR-note writes; some self-hosted
    #      installations restrict this.
    # Both unset → no-op (info log only). The job's pass/fail status
    # is what blocks merge; the comment is informational.
    - |
      if [ -z "${CI_MERGE_REQUEST_IID:-}" ]; then
        echo "info: not an MR pipeline; skipping comment post"
        exit 0
      fi
      REPORT="${CI_PROJECT_DIR}/sidecar/var/eval_gate_report.md"
      if [ ! -f "$REPORT" ]; then
        echo "warn: $REPORT not found; nothing to comment"
        exit 0
      fi
      TOKEN="${GLAB_TOKEN:-${CI_JOB_TOKEN:-}}"
      HEADER_NAME="PRIVATE-TOKEN"
      if [ -z "${GLAB_TOKEN:-}" ] && [ -n "${CI_JOB_TOKEN:-}" ]; then
        HEADER_NAME="JOB-TOKEN"
      fi
      if [ -z "$TOKEN" ]; then
        echo "info: no GLAB_TOKEN / CI_JOB_TOKEN; skipping comment post"
        exit 0
      fi
      # JSON-encode the report body via Python (already on PATH from
      # the python-base image) so embedded backticks / quotes / newlines
      # don't break the request payload.
      BODY_JSON="$(REPORT_PATH="$REPORT" python -c 'import json,os; print(json.dumps({"body": open(os.environ["REPORT_PATH"]).read()}))')"
      curl --silent --show-error --fail-with-body \
        --request POST \
        --header "${HEADER_NAME}: ${TOKEN}" \
        --header "Content-Type: application/json" \
        --data "${BODY_JSON}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" \
        || echo "warn: MR-note POST failed; comment skipped (job status still gates the merge)"
  artifacts:
    when: always
    # Artifact paths are evaluated relative to $CI_PROJECT_DIR, *not*
    # the script cwd — `.python_base` cd's into sidecar/ for `uv sync`
    # but artifacts always look from the repo root.
    paths:
      - sidecar/var/eval_gate_results.json
      - sidecar/var/eval_gate_report.md
    expire_in: 30 days
